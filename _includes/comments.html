{% if site.waline.serverURL %}
<link rel="stylesheet" href="{{ '/js/waline/waline.css' | prepend: site.baseurl }}">
<style>
    #waline {
        margin-top: 40px;
        --waline-theme-color: #0085a1;
        --waline-active-color: #00a7c9;
    }
</style>
<div id="waline"></div>
<script src="{{ '/js/waline/waline.umd.js' | prepend: site.baseurl }}"></script>
<script>
    Waline.init({
        el: '#waline',
        serverURL: {{ site.waline.serverURL | jsonify }},
        lang: 'zh-CN',
        // Comment without an account; every field below is optional, blank nickname shows as 匿名.
        login: 'disable',
        meta: ['nick', 'mail', 'link'],
        requiredMeta: [],
        locale: {
            nick: '昵称',
            mail: '邮箱',
            link: '网址',
            optional: '选填',
            placeholder: '无需登录即可评论。昵称可以不填，不填就是匿名；邮箱只用来接收回复提醒，不会公开。',
            sofa: '还没有评论，来抢沙发吧！',
            submit: '发表',
            comment: '评论',
            reply: '回复',
            cancelReply: '取消回复',
            like: '赞',
            cancelLike: '取消赞',
            refresh: '刷新',
            more: '加载更多…',
            preview: '预览',
            emoji: '表情',
            uploading: '上传中…',
            login: '登录',
            logout: '退出登录',
            admin: '管理员',
            anonymous: '匿名',
            seconds: '秒前',
            minutes: '分钟前',
            hours: '小时前',
            days: '天前',
            now: '刚刚'
        },
        // Waline's default emoji / GIF sources (unpkg, Giphy) are slow or blocked in mainland China.
        emoji: ['https://registry.npmmirror.com/@waline/emojis/1.4.0/files/weibo'],
        search: false,
        imageUploader: false,
        pageSize: 10
    });
</script>
{% endif %}
